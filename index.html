function priorUsed(split,slotIndex,limit=2){const keys=Object.keys(plans).filter(k=>plans[k]?.split===split).sort().reverse(),out=[];for(const k of keys){const ex=plans[k]?.exercises?.[slotIndex];if(ex?.filename)out.push(ex.filename);if(out.length>=limit)break}return out}
function chooseForSlot(split,slot,index,used){const [roleExpr,sets,reps,anchor]=slot;let pool=poolFor(roleExpr).filter(x=>!used.has(x.filename));if(!pool.length)pool=poolFor(roleExpr);const avoid=priorUsed(split,index,anchor?1:2),filtered=pool.filter(x=>!avoid.includes(x.filename));if(filtered.length)pool=filtered;const rng=seeded(`${anchor?twoWeekKey():mondayKey()}|${split}|${index}|${roleExpr}`);pool=[...pool].sort((a,b)=>a.name.localeCompare(b.name));const item=pool[Math.floor(rng()*pool.length)]||pool[0];return item?{...item,sets,reps,roleExpr,anchor}:null}
function ensurePlan(day){const key=skey(day);if(plans[key])return plans[key];const split=ROTATION[((rotationState.nextIndex%4)+4)%4],used=new Set(),exercises=[];WORKOUTS[split].slots.forEach((slot,i)=>{const ex=chooseForSlot(split,slot,i,used);if(ex){used.add(ex.filename);exercises.push(ex)}});plans[key]={split,week:mondayKey(),exercises,created:new Date().toISOString()};save();return plans[key]}
function stateKey(day,filename){return `${skey(day)}::${filename}`}
function entry(day,ex){const k=stateKey(day,ex.filename);if(!state[k])state[k]={sets:Array.from({length:ex.sets},()=>({w:'',r:'',d:false}))};while(state[k].sets.length<ex.sets)state[k].sets.push({w:'',r:'',d:false});state[k].sets=state[k].sets.slice(0,ex.sets);return state[k]}
function bestSet(sets){let best=null;for(const s of sets||[]){const w=Number(s.w),r=Number(s.r);if(!(w>0&&r>0))continue;if(!best||w>best.w||(w===best.w&&r>best.r))best={w,r}}return best}
function previousBest(filename){for(const h of history){const ex=(h.exercises||[]).find(x=>x.filename===filename);if(ex){const b=bestSet(ex.sets);if(b)return b}}return null}
function bestEver(filename){let b=null;for(const h of history)for(const ex of h.exercises||[])if(ex.filename===filename){const n=bestSet(ex.sets);if(n&&(!b||n.w>b.w||(n.w===b.w&&n.r>b.r)))b=n}return b}
function mediaSrc(ex){return reducedMotion?(ex.image||ex.gif_url):ex.gif_url}
function equipmentLabel(ex){const e=(ex.equipment||'gym equipment').trim();return /machine|sled|assisted/i.test(e)?`Machine: ${e}`:`Equipment: ${e}`}
function mediaHtml(ex,i){return `<button class="media media-open" data-ex="${i}" aria-label="Open ${esc(ex.name)} demonstration"><img loading="lazy" src="${esc(mediaSrc(ex))}" alt="${esc(ex.name)} demonstration"></button>`}
function renderRotation(){rotation.innerHTML=ROTATION.map((k,i)=>`<span class="chip ${i===rotationState.nextIndex?'current':''}">${esc(WORKOUTS[k].short)}</span>`).join('');nextPill.textContent=`Next: ${WORKOUTS[ROTATION[rotationState.nextIndex]].name}`}
function renderTabs(){tabs.innerHTML=DAYS.map(d=>`<button class="${d===current?'active':''}" data-day="${d}">${d==='Weekend'?'+1':d.slice(0,3)}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.day;save();render()})}
function prepCard(key,dose,phase){const ex=prepByKey[key],name=ex?.name||key.replaceAll('_',' '),src=ex?mediaSrc(ex):'',guide=PREP_FALLBACK[key]||'Move gently through a comfortable range.';if(!ex)return `<div class="prep-card no-media"><b>${esc(name)}</b><span class="prep-guide">${esc(guide)}</span><span class="prep-dose">${esc(dose)}</span></div>`;return `<div class="prep-card"><button class="prep-thumb prep-open" data-key="${esc(key)}" aria-label="Open ${esc(name)}"><img loading="lazy" src="${esc(src)}" alt="${esc(name)}"></button><b>${esc(name)}</b><span>${esc(dose)}</span></div>`}
function renderSession(){if(!LIB.length){sessionPanel.innerHTML=`<h2>Exercise library not prepared</h2><p class="small">${esc(libraryError||'Run prepare-exercise-library.py before deploying.')}</p>`;return}const plan=ensurePlan(current),w=WORKOUTS[plan.split];sessionPanel.innerHTML=`<div class="session-head"><div><h2>${esc(w.name)}</h2><p>${esc(w.focus)}</p></div><span class="pill">${plan.exercises.length} exercises</span></div><div class="warm-line"><div class="step-badge">1</div><div><b>Warm up</b><p>${esc(w.cardioWarm)}</p></div></div><div class="warm-line"><div class="step-badge">2</div><div><b>Dynamic prep</b><p>Move through these gently, then start lifting.</p><div class="prep-strip">${w.prep.map(x=>prepCard(x[0],x[1],'prep')).join('')}</div></div></div><div class="warm-line"><div class="step-badge">3</div><div><b>Ramp-up</b><p>Before the first two big lifts: 1 easy set at roughly half your working weight for 8–10 reps. Add another only if you still feel stiff.</p></div></div>`;sessionPanel.querySelectorAll('.prep-open').forEach(b=>b.onclick=()=>openPrep(b.dataset.key))}
function renderCooldown(){if(!LIB.length){cooldownPanel.innerHTML='';return}const plan=ensurePlan(current),w=WORKOUTS[plan.split];cooldownPanel.innerHTML=`<div class="section-title">After lifting</div><div class="cooldown-grid"><div class="compact-line"><b>Cardio finish</b><p>${esc(w.cardio)}</p></div><div class="compact-line"><b>Stretch</b><p>Gentle static stretches. Hold a light pull, never pain.</p><div class="prep-strip">${w.stretch.map(x=>prepCard(x[0],x[1],'stretch')).join('')}</div></div></div>`;cooldownPanel.querySelectorAll('.prep-open').forEach(b=>b.onclick=()=>openPrep(b.dataset.key))}
const REST_SECONDS=120;
function exerciseRole(ex){return ex.role||ex.roleExpr?.split('|')[0]||''}
function restSecondsFor(){return REST_SECONDS}
function fmtTime(sec){sec=Math.max(0,Math.ceil(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function primeAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}
function chime(){try{if(audioCtx&&audioCtx.state==='running'){[0,.18].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=i?880:660;g.gain.setValueAtTime(.0001,audioCtx.currentTime+d);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d+.14);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+.16)})}if(navigator.vibrate)navigator.vibrate([180,90,180])}catch{}}
function persistRest(){localStorage.setItem('gym-v9-rest',JSON.stringify(restState))}
function startRest(ex){primeAudio();restState={end:Date.now()+REST_SECONDS*1000,label:ex.name,duration:REST_SECONDS,ready:false};persistRest();tickRest()}
function clearRest(){restState={end:0,label:'',duration:0,ready:false};persistRest();document.title='Gym Tracker';tickRest()}
function tickRest(){if(!restDock)return;if(!restState.end){restDock.classList.remove('show','ready');return}const now=Date.now(),remaining=Math.ceil((restState.end-now)/1000);restDock.classList.add('show');if(remaining>0){restDock.classList.remove('ready');restLabel.textContent='Rest';restTime.textContent=fmtTime(remaining);return}restLabel.textContent='You can start';restTime.textContent='Ready';restDock.classList.add('ready');if(!restState.ready){restState.ready=true;persistRest();document.title='Ready · Gym Tracker';chime()}if(now-restState.end>8000)clearRest()}
function renderWorkout(){if(!LIB.length){workout.innerHTML='';return}const plan=ensurePlan(current);workout.innerHTML=plan.exercises.map((ex,i)=>{const e=entry(current,ex),prev=previousBest(ex.filename),best=bestEver(ex.filename),role=exerciseRole(ex),instruction=ex.instructions||ROLE_GUIDES[role]||'Follow the animation, use a controlled range and stop with about two good reps left.';return `<article class="exercise"><div class="exercise-main">${mediaHtml(ex,i)}<div class="excopy"><div class="title-row"><div><div class="extitle">${esc(ex.name)}</div><div class="target">${ex.sets} sets · ${esc(ex.reps)}${ex.anchor?' · anchor':''}</div></div><button class="tiny swap" data-i="${i}">Swap</button></div><div class="meta"><span class="equipment">${esc(equipmentLabel(ex))}</span><span>${esc(ex.target||ex.muscle_group||'target muscle')}</span></div><div class="prior">${prev?`Last ${clean(prev.w)} kg × ${prev.r}`:'First time'}${best?` · Best ${clean(best.w)} kg × ${best.r}`:''}</div><div class="rest-hint">2:00 rest after each set</div></div></div><div class="sets"><div class="set-head"><div></div><div>kg</div><div>reps</div><div>done</div></div>${e.sets.map((st,n)=>`<div class="set-row"><div class="set-num">${n+1}</div><input aria-label="Set ${n+1} weight" type="number" inputmode="decimal" step="0.5" value="${esc(st.w)}" data-i="${i}" data-s="${n}" data-f="w"><input aria-label="Set ${n+1} reps" type="number" inputmode="numeric" value="${esc(st.r)}" data-i="${i}" data-s="${n}" data-f="r"><div class="check"><input aria-label="Set ${n+1} complete" type="checkbox" ${st.d?'checked':''} data-i="${i}" data-s="${n}" data-f="d"></div></div>`).join('')}</div><details class="technique"><summary>Form & setup</summary><div class="tech">${esc(instruction)}</div></details></article>`}).join('');workout.querySelectorAll('input').forEach(inp=>{const fn=()=>{const ex=plan.exercises[+inp.dataset.i],en=entry(current,ex),set=en.sets[+inp.dataset.s],f=inp.dataset.f;set[f]=f==='d'?inp.checked:inp.value;if(f==='d'&&inp.checked)startRest(ex);save();renderStats()};inp.addEventListener(inp.type==='checkbox'?'change':'input',fn)});workout.querySelectorAll('.swap').forEach(b=>b.onclick=()=>swapExercise(+b.dataset.i));workout.querySelectorAll('.media-open').forEach(b=>b.onclick=()=>openExercise(+b.dataset.ex))}
function swapExercise(index){const plan=ensurePlan(current),w=WORKOUTS[plan.split],slot=w.slots[index],old=plan.exercises[index],used=new Set(plan.exercises.map(x=>x.filename));used.delete(old.filename);let pool=poolFor(slot[0]).filter(x=>!used.has(x.filename)&&x.filename!==old.filename);if(!pool.length)return;pool.sort((a,b)=>a.name.localeCompare(b.name));const rng=seeded(`${Date.now()}|${old.filename}|${index}`),x=pool[Math.floor(rng()*pool.length)];plan.exercises[index]={...x,sets:slot[1],reps:slot[2],roleExpr:slot[0],anchor:slot[3]};delete state[stateKey(current,old.filename)];save();render()}
function openExercise(i){const plan=ensurePlan(current),ex=plan.exercises[i];if(!ex)return;const role=exerciseRole(ex),instruction=ex.instructions||ROLE_GUIDES[role]||'',secondary=(ex.secondary_muscles||[]).join(', ')||'—';modalBody.innerHTML=`<div class="modal-media"><img src="${esc(ex.gif_url||ex.image)}" alt="${esc(ex.name)} demonstration"></div><h2>${esc(ex.name)}</h2><div class="modal-grid"><div class="modal-info"><div class="label">Equipment / machine</div><p>${esc(ex.equipment||'—')}</p></div><div class="modal-info"><div class="label">Target</div><p>${esc(ex.target||ex.muscle_group||'—')}</p></div><div class="modal-info"><div class="label">Secondary</div><p>${esc(secondary)}</p></div><div class="modal-info"><div class="label">Work</div><p>${ex.sets} × ${esc(ex.reps)} · 2:00 rest</p></div></div><div class="modal-info" style="margin-top:6px"><div class="label">Form & setup</div><p>${esc(instruction)}</p></div>`;showModal()}
function openPrep(key){const ex=prepByKey[key],guide=ex?.instructions||PREP_FALLBACK[key]||'Move gently through a comfortable range.';modalBody.innerHTML=`${ex?`<div class="modal-media"><img src="${esc(ex.gif_url||ex.image)}" alt="${esc(ex.name)}"></div>`:''}<h2 style="margin-top:8px">${esc(ex?.name||key.replaceAll('_',' '))}</h2><div class="modal-info" style="margin-top:6px"><div class="label">How to use it</div><p class="small">${esc(guide)}</p></div>${ex?`<div class="modal-grid"><div class="modal-info"><div class="label">Equipment</div><p>${esc(ex.equipment||'body weight')}</p></div><div class="modal-info"><div class="label">Target</div><p>${esc(ex.target||ex.muscle_group||'mobility')}</p></div></div>`:''}`;showModal()}
function showModal(){exerciseModal.classList.add('open');exerciseModal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeModal(){exerciseModal.classList.remove('open');exerciseModal.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function renderStats(){if(!LIB.length){sessionStats.innerHTML='';return}const plan=ensurePlan(current);let total=0,done=0;plan.exercises.forEach(ex=>{const e=entry(current,ex);total+=e.sets.length;done+=e.sets.filter(x=>x.d).length});const week=history.filter(h=>h.week===mondayKey()).length,pct=total?Math.round(done/total*100):0;sessionStats.innerHTML=`<div class="progress-line"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-copy">${done}/${total} sets · ${week}/3 this week</div></div>`}
function renderProgress(){const week=history.filter(h=>h.week===mondayKey()),pbs=week.reduce((n,h)=>n+(h.pbs?.length||0),0),recent=[];for(const h of history)for(const p of h.pbs||[]){recent.push(p);if(recent.length>=5)break}progressPanel.innerHTML=`<div class="metrics" style="margin-top:6px"><div class="metric"><b>${week.length}</b><span>sessions</span></div><div class="metric"><b>${pbs}</b><span>PBs this week</span></div><div class="metric"><b>${history.length}</b><span>total saved</span></div></div>${recent.length?recent.map(p=>`<div class="pb-row"><b>${esc(p.name)}</b> <span class="small positive">${esc(p.text)}</span></div>`).join(''):'<p class="small">Personal bests appear here when an exercise comes back into rotation.</p>'}`}
function renderWeight(){weightLog.sort((a,b)=>a.date.localeCompare(b.date));const last=weightLog.at(-1),prev=weightLog.at(-2),delta=last&&prev?Math.round((last.weight-prev.weight)*10)/10:null;weightPanel.innerHTML=`<div class="flex" style="margin-top:6px"><div><div class="weight-now">${last?clean(last.weight)+' kg':'—'}</div><div class="small">${delta===null?'No comparison yet':`${delta>0?'+':''}${clean(delta)} kg from previous`}</div></div></div><div class="weight-form"><label><span class="small">kg</span><input id="weightInput" type="number" step="0.1" min="20" max="500"></label><label><span class="small">Date</span><input id="weightDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="primary" id="saveWeightBtn">Save</button></div><div class="chart"><svg id="weightChart" viewBox="0 0 480 130"></svg></div>${[...weightLog].reverse().slice(0,4).map(x=>`<div class="weight-row flex"><span class="small">${x.date}</span><b>${clean(x.weight)} kg</b><button class="tiny" data-date="${x.date}">Delete</button></div>`).join('')}`;document.getElementById('saveWeightBtn').onclick=saveWeight;weightPanel.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{weightLog=weightLog.filter(x=>x.date!==b.dataset.date);save();renderWeight()});drawWeightChart()}
function saveWeight(){const w=Number(document.getElementById('weightInput').value),d=document.getElementById('weightDate').value;if(!Number.isFinite(w)||w<20||w>500||!d){alert('Enter a valid weight and date.');return}const old=weightLog.find(x=>x.date===d);if(old)old.weight=Math.round(w*10)/10;else weightLog.push({date:d,weight:Math.round(w*10)/10});save();renderWeight()}
function drawWeightChart(){const svg=document.getElementById('weightChart');if(!svg)return;const data=weightLog.slice(-10);if(data.length<2){svg.innerHTML='<text x="240" y="68" text-anchor="middle" fill="#abc8b7" font-size="12">Log two weights to see the trend.</text>';return}const vals=data.map(x=>x.weight),min=Math.min(...vals),max=Math.max(...vals),range=Math.max(.5,max-min),pts=data.map((x,i)=>[25+430*i/(data.length-1),108-(x.weight-min)/range*78]);svg.innerHTML=`<path d="${pts.map((p,i)=>`${i?'L':'M'} ${p[0]} ${p[1]}`).join(' ')}" fill="none" stroke="#55d98e" stroke-width="4" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#92efba"/>`).join('')}`}
function renderHistory(){historyPanel.innerHTML=history.length?history.slice(0,30).map(h=>`<div class="history-row"><b>${esc(h.workoutName)}</b> · <span class="small">${esc(new Date(h.isoDate).toLocaleString())}</span><br><span class="small">${h.exercises.map(x=>esc(x.name)).join(' · ')}</span>${h.pbs?.length?`<br><span class="small positive">${h.pbs.length} PB${h.pbs.length===1?'':'s'}</span>`:''}</div>`).join(''):'<p class="small">No saved workouts yet.</p>'}
function clearOtherUnsavedPlans(exceptKey){for(const k of Object.keys(plans)){if(k===exceptKey)continue;if(!history.some(h=>h.sessionKey===k)){const p=plans[k];for(const ex of p.exercises||[])delete state[`${k}::${ex.filename}`];delete plans[k]}}}
function renderSettings(){settingsPanel.innerHTML=`<p class="small">The split advances only after a saved workout. Skipping the optional +1 does not move the sequence.</p><div style="display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:7px"><select id="rotationSelect">${ROTATION.map((k,i)=>`<option value="${i}" ${i===rotationState.nextIndex?'selected':''}>Next: ${WORKOUTS[k].name}</option>`).join('')}</select><button id="setRotationBtn">Set</button></div><div class="actions"><button id="regenBtn">Regenerate today's exercises</button></div><p class="small">${LIB.length||106} exercise pool · main anchors hold roughly two weeks · supporting movements rotate weekly.</p>`;document.getElementById('setRotationBtn').onclick=()=>{rotationState.nextIndex=Number(document.getElementById('rotationSelect').value)||0;clearOtherUnsavedPlans('');delete plans[skey(current)];save();render()};document.getElementById('regenBtn').onclick=()=>{if(confirm('Generate a different selection for this day?')){delete plans[skey(current)];save();render()}}}
function finish(){if(!LIB.length)return;const plan=ensurePlan(current),key=skey(current),wasSaved=history.some(h=>h.sessionKey===key),prior={};plan.exercises.forEach(ex=>prior[ex.filename]=bestEver(ex.filename));const exercises=plan.exercises.map(ex=>({filename:ex.filename,id:ex.id,name:ex.name,role:ex.role,sets:entry(current,ex).sets.filter(s=>s.d||s.w||s.r).map(s=>({w:s.w,r:s.r,d:s.d}))})).filter(x=>x.sets.length);if(!exercises.length){alert('There is nothing to save yet.');return}const pbs=[];for(const ex of exercises){const now=bestSet(ex.sets),old=prior[ex.filename];if(now&&(!old||now.w>old.w||(now.w===old.w&&now.r>old.r))){const text=!old?'First recorded result':now.w>old.w?`+${clean(now.w-old.w)} kg`:`+${now.r-old.r} reps at ${clean(now.w)} kg`;pbs.push({name:ex.name,text})}}const rec={version:VERSION,sessionKey:key,week:mondayKey(),day:current,split:plan.split,workoutName:WORKOUTS[plan.split].name,isoDate:new Date().toISOString(),exercises,pbs};const idx=history.findIndex(h=>h.sessionKey===key);if(idx>=0)history[idx]=rec;else history.unshift(rec);history.sort((a,b)=>new Date(b.isoDate)-new Date(a.isoDate));if(!wasSaved){rotationState.nextIndex=(ROTATION.indexOf(plan.split)+1)%ROTATION.length;clearOtherUnsavedPlans(key)}clearRest();save();render();alert(`Workout saved${pbs.length?`. ${pbs.length} PB${pbs.length===1?'':'s'} recorded.`:'.'}`)}
function clearUnsaved(){if(history.some(h=>h.sessionKey===skey(current))){alert('This session is already saved.');return}if(!confirm('Clear this unsaved session?'))return;clearRest();const plan=plans[skey(current)];if(plan)plan.exercises.forEach(ex=>delete state[stateKey(current,ex.filename)]);delete plans[skey(current)];save();render()}
function exportData(){const payload={version:VERSION,state,history,plans,rotationState,weightLog,current};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='gym-tracker-v10.1-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);state=d.state||{};history=d.history||[];plans=d.plans||{};rotationState=d.rotationState||{nextIndex:0};weightLog=d.weightLog||[];current=d.current||current;save();render()}catch{alert('That backup could not be read.')}};r.readAsText(file)}
function wipe(){if(!confirm('Wipe all workout and weight data?'))return;clearRest();state={};history=[];plans={};rotationState={nextIndex:0};weightLog=[];save();render()}
function render(){renderRotation();renderTabs();renderSession();renderWorkout();renderCooldown();renderStats();renderProgress();renderWeight();renderHistory();renderSettings();libraryPill.textContent=LIB.length?`${LIB.length} exercises`:'Library missing';tickRest()}
async function loadLibraries(){try{const [a,b]=await Promise.all([fetch('./exercise-library.json',{cache:'no-store'}),fetch('./prep-library.json',{cache:'no-store'})]);if(!a.ok)throw new Error(`exercise-library.json returned ${a.status}`);LIB=await a.json();PREP=b.ok?await b.json():[];byRole={};for(const ex of LIB)(byRole[ex.role]??=[]).push(ex);prepByKey={};for(const ex of PREP)prepByKey[ex.key]=ex;libraryError=''}catch(e){LIB=[];PREP=[];byRole={};prepByKey={};libraryError='Run prepare-exercise-library.py first.'}render()}
const rotation=document.getElementById('rotation'),nextPill=document.getElementById('nextPill'),tabs=document.getElementById('tabs'),sessionPanel=document.getElementById('sessionPanel'),workout=document.getElementById('workout'),cooldownPanel=document.getElementById('cooldownPanel'),sessionStats=document.getElementById('sessionStats'),progressPanel=document.getElementById('progressPanel'),weightPanel=document.getElementById('weightPanel'),historyPanel=document.getElementById('historyPanel'),settingsPanel=document.getElementById('settingsPanel'),libraryPill=document.getElementById('libraryPill'),exerciseModal=document.getElementById('exerciseModal'),modalBody=document.getElementById('modalBody'),restDock=document.getElementById('restDock'),restLabel=document.getElementById('restLabel'),restTime=document.getElementById('restTime');
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tickRest()});restTicker=setInterval(tickRest,500);document.getElementById('finishBtn').onclick=finish;document.getElementById('clearBtn').onclick=clearUnsaved;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};document.getElementById('wipeBtn').onclick=wipe;document.getElementById('modalClose').onclick=closeModal;exerciseModal.onclick=e=>{if(e.target===exerciseModal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));save();loadLibraries();
