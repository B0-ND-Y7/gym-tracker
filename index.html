<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d5035">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym Tracker</title>
<style>
:root{--bg:#06170f;--bg2:#0a2117;--panel:#0e2b20;--line:#24523e;--text:#f4fbf6;--muted:#abc8b7;--accent:#55d98e;--accent2:#92efba;--soft:#153b2b;--danger:#a7444e;--warning:#e6c15c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--text);background:radial-gradient(circle at top right,rgba(85,217,142,.12),transparent 20%),linear-gradient(180deg,var(--bg),var(--bg2))}.wrap{max-width:860px;margin:auto;padding:10px 10px 36px}.header,.panel,.exercise,details{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.018));border-radius:15px}.header{padding:12px;margin-bottom:8px}.flex{display:flex;gap:8px;align-items:center;justify-content:space-between}.wrapflex{display:flex;gap:6px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}p{margin:4px 0;color:var(--muted);line-height:1.35}.small{font-size:11px;color:var(--muted)}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:#9fc8b2}.pill,.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;color:var(--muted);background:rgba(255,255,255,.025);white-space:nowrap}.chip.current{background:var(--accent2);border-color:var(--accent2);color:#05160e;font-weight:850}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}button,.btn{min-height:39px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#173f2f,#123327);color:var(--text);font-weight:750;padding:7px 9px;cursor:pointer}button.active{background:linear-gradient(180deg,rgba(85,217,142,.28),rgba(85,217,142,.12));border-color:#51ce84}button.primary{background:linear-gradient(180deg,#55d98e,#2cac65);border-color:#55d98e;color:#fff}button.tiny{min-height:28px;padding:3px 7px;font-size:10px}button.danger{background:linear-gradient(180deg,#ad4752,#87313a);border-color:#ad4752}.panel{padding:10px;margin-bottom:8px}.brief{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.brief>div{border:1px solid var(--line);border-radius:10px;padding:7px;background:rgba(255,255,255,.018)}.exercise{padding:8px;margin:6px 0}.exercise-top{display:grid;grid-template-columns:86px 1fr auto;gap:9px;align-items:start}.media{width:86px;height:86px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid #dce7df}.media img{width:100%;height:100%;object-fit:contain;display:block}.excopy{min-width:0}.extitle{font-size:15px;font-weight:850;line-height:1.15}.target{font-size:11px;font-weight:800;color:var(--accent2);margin-top:2px}.meta{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.meta span{font-size:9px;padding:2px 5px;border:1px solid rgba(85,217,142,.18);border-radius:999px;background:rgba(85,217,142,.07);color:#def8e8}.prior{font-size:10px;color:var(--muted);margin-top:4px}.sets{border-top:1px solid rgba(255,255,255,.07);padding-top:6px;margin-top:6px}.set-head,.set-row{display:grid;grid-template-columns:26px 1fr 1fr 38px;gap:5px;align-items:center}.set-head{font-size:9px;color:var(--muted);font-weight:800}.set-row{margin-top:4px}input[type=number],input[type=date],select{width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;background:#092118;color:var(--text);font-size:16px;padding:5px 7px}input[type=checkbox]{width:20px;height:20px;accent-color:#3fd579}.check{display:flex;justify-content:center}details.technique{margin-top:6px;padding:5px 7px;border-radius:9px;background:rgba(255,255,255,.014)}summary{cursor:pointer;font-weight:800;font-size:12px}.tech{font-size:10px;color:var(--muted);line-height:1.35;margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions>*{flex:1}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.metric{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.018);padding:6px;text-align:center}.metric b{display:block;font-size:15px}.metric span{font-size:9px;color:var(--muted)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}details{padding:8px;margin-top:8px}.history-row,.weight-row,.pb-row{padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}.history-row:first-child,.weight-row:first-child,.pb-row:first-child{border-top:0}.positive{color:var(--accent2)}.weight-form{display:grid;grid-template-columns:1fr 1fr auto;gap:5px;align-items:end;margin-top:6px}.weight-now{font-size:22px;font-weight:850}.chart{margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:5px}#weightChart{width:100%;height:auto;display:block}a{color:var(--accent2)}
@media(max-width:620px){.brief,.bottom{grid-template-columns:1fr}.exercise-top{grid-template-columns:78px 1fr auto}.media{width:78px;height:78px}.weight-form{grid-template-columns:1fr 1fr}.weight-form button{grid-column:1/-1}}@media(max-width:390px){.exercise-top{grid-template-columns:70px 1fr}.exercise-top>.tiny{grid-column:2;justify-self:start}.media{width:70px;height:70px}.tabs button{font-size:10px;padding:5px 2px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="flex"><div><h1>Gym Tracker</h1><p class="small">Focused rolling split with controlled weekly variation.</p></div><span class="pill" id="libraryPill">Loading library…</span></div>
    <div class="flex" style="margin-top:8px;align-items:flex-start"><div><div class="label">Rolling split</div><div class="wrapflex" id="rotation"></div></div><span class="pill" id="nextPill"></span></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <section class="panel" id="sessionPanel"></section>
  <main id="workout"></main>
  <section class="panel" id="sessionStats"></section>
  <div class="actions"><button class="primary" id="finishBtn">Finish and save</button><button id="clearBtn">Clear unsaved</button></div>
  <div class="bottom"><details open><summary>Progress</summary><div id="progressPanel"></div></details><details><summary>Body weight</summary><div id="weightPanel"></div></details></div>
  <details><summary>Workout history</summary><div id="historyPanel"></div></details>
  <details><summary>Plan and settings</summary><div id="settingsPanel"></div></details>
  <details><summary>Backup and reset</summary><p class="small">v8.5 uses a fresh local data store.</p><div class="actions"><button id="exportBtn">Export backup</button><label class="btn" for="importFile">Import backup</label><input hidden id="importFile" type="file" accept="application/json"><button class="danger" id="wipeBtn">Wipe v8.5 data</button></div></details>
</div>
<script>
const VERSION='8.5';
const ROTATION=['upperPush','upperPull','legsA','lowerB'];
const DAYS=['Monday','Wednesday','Friday','Weekend'];
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const WORKOUTS={
 upperPush:{name:'Upper Push',short:'Push',focus:'Chest, shoulders and triceps.',warmup:'5 min brisk treadmill walk, then one light set on the first two presses.',cardio:'8–12 min incline walk at a steady pace.',slots:[['push_horizontal',3,'6–10',true],['push_incline|push_fly',3,'8–12',false],['push_vertical',3,'8–12',true],['push_lateral',2,'10–15',false],['push_triceps',2,'10–15',false],['push_triceps|push_fly',2,'10–15',false]]},
 upperPull:{name:'Upper Pull',short:'Pull',focus:'Back, rear shoulders and biceps.',warmup:'5 min easy rowing, then one light set on the first pulldown and row.',cardio:'8–12 min steady bike or treadmill.',slots:[['pull_vertical',3,'8–12',true],['pull_row',3,'8–12',true],['pull_row|pull_rear',2,'8–12',false],['pull_rear',2,'10–15',false],['pull_biceps',2,'8–12',false],['pull_biceps',2,'10–15',false]]},
 legsA:{name:'Legs A',short:'Legs A',focus:'Quad-dominant legs and calves.',warmup:'5 min easy bike, then one light set on the first two leg movements.',cardio:'8–10 min easy incline walk after lifting.',slots:[['lower_compound',3,'6–10',true],['lower_compound',3,'8–12',false],['lower_quad',2,'10–15',false],['lower_ham_curl',2,'10–15',false],['lower_calf',3,'10–15',false],['lower_hip',2,'12–15',false]]},
 lowerB:{name:'Lower Body B',short:'Lower B',focus:'Hamstrings, glutes and calves.',warmup:'5 min brisk flat walk, then one light set on the first hinge or glute movement.',cardio:'8–12 min steady bike at a moderate resistance.',slots:[['lower_hinge',3,'6–10',true],['lower_glute',3,'8–12',true],['lower_ham_curl',3,'8–12',false],['lower_compound',2,'10–12',false],['lower_hip',2,'12–15',false],['lower_calf',2,'12–15',false]]}
};
const ROLE_GUIDES={
 push_horizontal:'Set the machine or bench so the handles/bar line up naturally with the chest. Keep the upper back stable, press smoothly, and control the return.',
 push_incline:'Keep the upper back against the support and use a comfortable incline. Press through a smooth range without forcing the shoulders forward.',
 push_fly:'Keep a soft elbow bend. Bring the arms together using the chest and return slowly into a comfortable stretch.',
 push_vertical:'Brace against the support, keep forearms roughly vertical, press overhead smoothly and avoid excessive lower-back arching.',
 push_lateral:'Use a light-to-moderate load. Raise to around shoulder height without swinging and lower slowly.',
 push_triceps:'Keep the upper arms controlled. Straighten the elbows, squeeze the triceps, and return without letting momentum take over.',
 pull_vertical:'Keep the chest tall and drive the elbows down. Avoid turning the movement into a big backward lean.',
 pull_row:'Keep the torso supported or stable. Pull toward the lower ribs, squeeze the back briefly, then return under control.',
 pull_rear:'Keep shoulders down and use the rear shoulders/upper back to open the arms. Avoid shrugging.',
 pull_biceps:'Keep the upper arm as still as possible. Curl through a comfortable range and lower fully under control.',
 lower_compound:'Keep the whole foot planted and knees tracking over the feet. Use a comfortable depth and drive up smoothly.',
 lower_quad:'Align the knee with the machine pivot where applicable. Extend smoothly, squeeze the quads, and lower under control.',
 lower_ham_curl:'Keep the hips supported and curl from the knee. Squeeze the hamstrings and control the return.',
 lower_hinge:'Push the hips back while keeping the spine neutral. Stop at a strong hamstring stretch, then extend the hips.',
 lower_glute:'Drive through the feet and extend the hips. Squeeze the glutes at the top without overextending the lower back.',
 lower_hip:'Keep the torso stable and move through a controlled range at the hips. Avoid bouncing the stack.',
 lower_calf:'Use a full comfortable stretch at the bottom and pause briefly at the top. Avoid bouncing.'
};
let LIB=[];let byRole={};let libraryError='';
let current=localStorage.getItem('gym-v85-current')||bestDay();
let state=read('gym-v85-state',{}),history=read('gym-v85-history',[]),plans=read('gym-v85-plans',{}),rotationState=read('gym-v85-rotation',{nextIndex:0}),weightLog=read('gym-v85-weight',[]);
function read(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}
function save(){localStorage.setItem('gym-v85-current',current);localStorage.setItem('gym-v85-state',JSON.stringify(state));localStorage.setItem('gym-v85-history',JSON.stringify(history));localStorage.setItem('gym-v85-plans',JSON.stringify(plans));localStorage.setItem('gym-v85-rotation',JSON.stringify(rotationState));localStorage.setItem('gym-v85-weight',JSON.stringify(weightLog))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bestDay(){const d=new Date().getDay();if(d===1||d===2)return'Monday';if(d===3||d===4)return'Wednesday';if(d===5)return'Friday';return'Weekend'}
function mondayKey(date=new Date()){const d=new Date(date);d.setHours(12,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function weekNumber(){const start=new Date('2026-01-05T12:00:00');const now=new Date(mondayKey()+'T12:00:00');return Math.floor((now-start)/604800000)}
function twoWeekKey(){return Math.floor(weekNumber()/2)}
function skey(day){return `v85::${mondayKey()}::${day}`}
function clean(v){const n=Number(v);return Number.isFinite(n)?String(Math.round(n*10)/10):'—'}
function seeded(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function splitForDay(day){const p=plans[skey(day)];return p?.split||ROTATION[((rotationState.nextIndex%4)+4)%4]}
function poolFor(expr){const roles=expr.split('|');return roles.flatMap(r=>byRole[r]||[])}
function priorUsed(split,slotIndex,limit=2){const keys=Object.keys(plans).filter(k=>plans[k]?.split===split).sort().reverse();const out=[];for(const k of keys){const ex=plans[k]?.exercises?.[slotIndex];if(ex?.filename)out.push(ex.filename);if(out.length>=limit)break}return out}
function chooseForSlot(split,slot,index,used){const [roleExpr,sets,reps,anchor]=slot;let pool=poolFor(roleExpr).filter(x=>!used.has(x.filename));if(!pool.length)pool=poolFor(roleExpr);const avoid=priorUsed(split,index,anchor?1:2);const filtered=pool.filter(x=>!avoid.includes(x.filename));if(filtered.length)pool=filtered;const seed=`${anchor?twoWeekKey():mondayKey()}|${split}|${index}|${roleExpr}`;const rng=seeded(seed);pool=[...pool].sort((a,b)=>a.name.localeCompare(b.name));const item=pool[Math.floor(rng()*pool.length)]||pool[0];return item?{...item,sets,reps,roleExpr,anchor}:null}
function ensurePlan(day){const key=skey(day);if(plans[key])return plans[key];const split=ROTATION[((rotationState.nextIndex%4)+4)%4],used=new Set(),exercises=[];WORKOUTS[split].slots.forEach((slot,i)=>{const ex=chooseForSlot(split,slot,i,used);if(ex){used.add(ex.filename);exercises.push(ex)}});plans[key]={split,week:mondayKey(),exercises,created:new Date().toISOString()};save();return plans[key]}
function stateKey(day,filename){return `${skey(day)}::${filename}`}
function entry(day,ex){const k=stateKey(day,ex.filename);if(!state[k])state[k]={sets:Array.from({length:ex.sets},()=>({w:'',r:'',d:false}))};while(state[k].sets.length<ex.sets)state[k].sets.push({w:'',r:'',d:false});state[k].sets=state[k].sets.slice(0,ex.sets);return state[k]}
function bestSet(sets){let best=null;for(const s of sets||[]){const w=Number(s.w),r=Number(s.r);if(!(w>0&&r>0))continue;if(!best||w>best.w||(w===best.w&&r>best.r))best={w,r}}return best}
function previousBest(filename){for(const h of history){const ex=(h.exercises||[]).find(x=>x.filename===filename);if(ex){const b=bestSet(ex.sets);if(b)return b}}return null}
function bestEver(filename){let b=null;for(const h of history)for(const ex of h.exercises||[])if(ex.filename===filename){const n=bestSet(ex.sets);if(n&&(!b||n.w>b.w||(n.w===b.w&&n.r>b.r)))b=n}return b}
function mediaHtml(ex){const src=reducedMotion?(ex.image||ex.gif_url):ex.gif_url;return `<div class="media"><img loading="lazy" src="${esc(src)}" alt="${esc(ex.name)} demonstration"></div>`}
function renderRotation(){rotation.innerHTML=ROTATION.map((k,i)=>`<span class="chip ${i===rotationState.nextIndex?'current':''}">${esc(WORKOUTS[k].short)}</span>`).join('');nextPill.textContent=`Next: ${WORKOUTS[ROTATION[rotationState.nextIndex]].name}`}
function renderTabs(){tabs.innerHTML=DAYS.map(d=>`<button class="${d===current?'active':''}" data-day="${d}">${d==='Weekend'?'+1':d.slice(0,3)}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.day;save();render()})}
function renderSession(){if(!LIB.length){sessionPanel.innerHTML=`<h2>Exercise library not prepared</h2><p>${esc(libraryError||'Run prepare-exercise-library.py before deploying.')}</p>`;return}const plan=ensurePlan(current),w=WORKOUTS[plan.split];sessionPanel.innerHTML=`<div class="flex"><div><h2>${esc(w.name)}</h2><p>${esc(w.focus)}</p></div><span class="pill">${plan.exercises.length} exercises</span></div><div class="brief"><div><div class="label">Warm-up</div><p class="small">${esc(w.warmup)}</p></div><div><div class="label">Cardio finish</div><p class="small">${esc(w.cardio)}</p></div></div><p class="small" style="margin-top:7px">Variation is controlled: the main anchor repeats for roughly two weeks, while the supporting exercises rotate weekly. This keeps the plan fresh without making progression impossible to judge.</p>`}
function renderWorkout(){if(!LIB.length){workout.innerHTML='';return}const plan=ensurePlan(current);workout.innerHTML=plan.exercises.map((ex,i)=>{const e=entry(current,ex),prev=previousBest(ex.filename),best=bestEver(ex.filename);const role=ex.role||ex.roleExpr?.split('|')[0]||'';const instruction=ex.instructions||ROLE_GUIDES[role]||'Follow the animation, use a controlled range, and stop with about two good reps left.';return `<article class="exercise"><div class="exercise-top">${mediaHtml(ex)}<div class="excopy"><div class="extitle">${esc(ex.name)}</div><div class="target">${ex.sets} sets · ${esc(ex.reps)}${ex.anchor?' · anchor':''}</div><div class="meta"><span>${esc(ex.equipment||'gym equipment')}</span><span>${esc(ex.target||ex.muscle_group||'target muscle')}</span></div><div class="prior">${prev?`Last: ${clean(prev.w)} kg × ${prev.r}`:'First time'}${best?` · Best: ${clean(best.w)} kg × ${best.r}`:''}</div></div><button class="tiny swap" data-i="${i}">Swap</button></div><div class="sets"><div class="set-head"><div>Set</div><div>kg</div><div>Reps</div><div>Done</div></div>${e.sets.map((s,n)=>`<div class="set-row"><div>${n+1}</div><input type="number" inputmode="decimal" step="0.5" value="${esc(s.w)}" data-i="${i}" data-s="${n}" data-f="w"><input type="number" inputmode="numeric" value="${esc(s.r)}" data-i="${i}" data-s="${n}" data-f="r"><div class="check"><input type="checkbox" ${s.d?'checked':''} data-i="${i}" data-s="${n}" data-f="d"></div></div>`).join('')}</div><details class="technique"><summary>Technique</summary><div class="tech">${esc(instruction)}</div></details></article>`}).join('');workout.querySelectorAll('input').forEach(inp=>{const fn=()=>{const ex=plan.exercises[+inp.dataset.i],en=entry(current,ex),set=en.sets[+inp.dataset.s],f=inp.dataset.f;set[f]=f==='d'?inp.checked:inp.value;save();renderStats()};inp.addEventListener(inp.type==='checkbox'?'change':'input',fn)});workout.querySelectorAll('.swap').forEach(b=>b.onclick=()=>swapExercise(+b.dataset.i))}
function swapExercise(i){const plan=ensurePlan(current),old=plan.exercises[i],slot=WORKOUTS[plan.split].slots[i],used=new Set(plan.exercises.map(x=>x.filename));used.delete(old.filename);let pool=poolFor(slot[0]).filter(x=>!used.has(x.filename)&&x.filename!==old.filename);if(!pool.length)return;const rng=seeded(`${Date.now()}|${old.filename}|${i}`);const ex=pool[Math.floor(rng()*pool.length)];plan.exercises[i]={...ex,sets:slot[1],reps:slot[2],roleExpr:slot[0],anchor:slot[3]};delete state[stateKey(current,old.filename)];save();render()}
function renderStats(){if(!LIB.length){sessionStats.innerHTML='';return}const plan=ensurePlan(current);let total=0,done=0;plan.exercises.forEach(ex=>{const e=entry(current,ex);total+=e.sets.length;done+=e.sets.filter(s=>s.d).length});const week=history.filter(h=>h.week===mondayKey()).length;sessionStats.innerHTML=`<div class="metrics"><div class="metric"><b>${done}/${total}</b><span>sets done</span></div><div class="metric"><b>${total?Math.round(done/total*100):0}%</b><span>session</span></div><div class="metric"><b>${week}/3${week>3?' +':''}</b><span>this week</span></div></div>`}
function renderProgress(){const week=history.filter(h=>h.week===mondayKey());const pbs=week.reduce((n,h)=>n+(h.pbs?.length||0),0);const recent=[];for(const h of history)for(const p of h.pbs||[]){recent.push(p);if(recent.length>=5)break}progressPanel.innerHTML=`<div class="metrics" style="margin-top:6px"><div class="metric"><b>${week.length}</b><span>sessions</span></div><div class="metric"><b>${pbs}</b><span>PBs this week</span></div><div class="metric"><b>${history.length}</b><span>total saved</span></div></div>${recent.length?recent.map(p=>`<div class="pb-row"><b>${esc(p.name)}</b> <span class="small positive">${esc(p.text)}</span></div>`).join(''):'<p class="small">Personal bests appear here when an exercise comes back into the rotation.</p>'}`}
function renderWeight(){weightLog.sort((a,b)=>a.date.localeCompare(b.date));const last=weightLog.at(-1),prev=weightLog.at(-2),delta=last&&prev?Math.round((last.weight-prev.weight)*10)/10:null;weightPanel.innerHTML=`<div class="flex" style="margin-top:6px"><div><div class="weight-now">${last?clean(last.weight)+' kg':'—'}</div><div class="small">${delta===null?'No comparison yet':`${delta>0?'+':''}${clean(delta)} kg from previous`}</div></div></div><div class="weight-form"><label><span class="small">kg</span><input id="weightInput" type="number" step="0.1" min="20" max="500"></label><label><span class="small">Date</span><input id="weightDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="primary" id="saveWeightBtn">Save</button></div><div class="chart"><svg id="weightChart" viewBox="0 0 480 130"></svg></div>${[...weightLog].reverse().slice(0,4).map(x=>`<div class="weight-row flex"><span class="small">${x.date}</span><b>${clean(x.weight)} kg</b><button class="tiny" data-date="${x.date}">Delete</button></div>`).join('')}`;document.getElementById('saveWeightBtn').onclick=saveWeight;weightPanel.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{weightLog=weightLog.filter(x=>x.date!==b.dataset.date);save();renderWeight()});drawWeightChart()}
function saveWeight(){const w=Number(document.getElementById('weightInput').value),d=document.getElementById('weightDate').value;if(!Number.isFinite(w)||w<20||w>500||!d){alert('Enter a valid weight and date.');return}const old=weightLog.find(x=>x.date===d);if(old)old.weight=Math.round(w*10)/10;else weightLog.push({date:d,weight:Math.round(w*10)/10});save();renderWeight()}
function drawWeightChart(){const svg=document.getElementById('weightChart');if(!svg)return;const data=weightLog.slice(-10);if(data.length<2){svg.innerHTML='<text x="240" y="68" text-anchor="middle" fill="#abc8b7" font-size="12">Log two weights to see the trend.</text>';return}const vals=data.map(x=>x.weight),min=Math.min(...vals),max=Math.max(...vals),range=Math.max(.5,max-min),pts=data.map((x,i)=>[25+430*i/(data.length-1),108-(x.weight-min)/range*78]);svg.innerHTML=`<path d="${pts.map((p,i)=>`${i?'L':'M'} ${p[0]} ${p[1]}`).join(' ')}" fill="none" stroke="#55d98e" stroke-width="4" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#92efba"/>`).join('')}`}
function renderHistory(){historyPanel.innerHTML=history.length?history.slice(0,30).map(h=>`<div class="history-row"><b>${esc(h.workoutName)}</b> · <span class="small">${esc(new Date(h.isoDate).toLocaleString())}</span><br><span class="small">${h.exercises.map(x=>esc(x.name)).join(' · ')}</span>${h.pbs?.length?`<br><span class="small positive">${h.pbs.length} PB${h.pbs.length===1?'':'s'}</span>`:''}</div>`).join(''):'<p class="small">No saved workouts yet.</p>'}
function clearOtherUnsavedPlans(exceptKey){for(const k of Object.keys(plans)){if(k===exceptKey)continue;if(!history.some(h=>h.sessionKey===k)){const p=plans[k];for(const ex of p.exercises||[])delete state[`${k}::${ex.filename}`];delete plans[k]}}}
function renderSettings(){settingsPanel.innerHTML=`<p class="small">The split only advances when you finish and save a workout. Friday can therefore flow directly into Monday. The optional +1 session simply performs the next split if you choose to train.</p><p class="small"><b>Variation:</b> the app draws from ${LIB.length||'about 100'} common-gym exercises. Main anchors repeat for a two-week block; supporting movements rotate weekly with repeat protection.</p><div class="label" style="margin-top:7px">Set next workout</div><div style="display:grid;grid-template-columns:1fr auto;gap:5px"><select id="rotationSelect">${ROTATION.map((k,i)=>`<option value="${i}" ${i===rotationState.nextIndex?'selected':''}>${WORKOUTS[k].name}</option>`).join('')}</select><button id="setRotationBtn">Set</button></div><div class="actions"><button id="regenBtn">Regenerate this day</button></div>`;document.getElementById('setRotationBtn').onclick=()=>{rotationState.nextIndex=Number(document.getElementById('rotationSelect').value)||0;clearOtherUnsavedPlans('');delete plans[skey(current)];save();render()};document.getElementById('regenBtn').onclick=()=>{if(confirm('Generate a different selection for this day?')){delete plans[skey(current)];save();render()}}}
function finish(){if(!LIB.length)return;const plan=ensurePlan(current),key=skey(current),wasSaved=history.some(h=>h.sessionKey===key),prior={};plan.exercises.forEach(ex=>prior[ex.filename]=bestEver(ex.filename));const exercises=plan.exercises.map(ex=>({filename:ex.filename,id:ex.id,name:ex.name,role:ex.role,sets:entry(current,ex).sets.filter(s=>s.d||s.w||s.r).map(s=>({w:s.w,r:s.r,d:s.d}))})).filter(x=>x.sets.length);if(!exercises.length){alert('There is nothing to save yet.');return}const pbs=[];for(const ex of exercises){const now=bestSet(ex.sets),old=prior[ex.filename];if(now&&(!old||now.w>old.w||(now.w===old.w&&now.r>old.r))){let text=!old?'First recorded result':now.w>old.w?`+${clean(now.w-old.w)} kg`:`+${now.r-old.r} reps at ${clean(now.w)} kg`;pbs.push({name:ex.name,text})}}const rec={version:VERSION,sessionKey:key,week:mondayKey(),day:current,split:plan.split,workoutName:WORKOUTS[plan.split].name,isoDate:new Date().toISOString(),exercises,pbs};const idx=history.findIndex(h=>h.sessionKey===key);if(idx>=0)history[idx]=rec;else history.unshift(rec);history.sort((a,b)=>new Date(b.isoDate)-new Date(a.isoDate));if(!wasSaved){rotationState.nextIndex=(ROTATION.indexOf(plan.split)+1)%ROTATION.length;clearOtherUnsavedPlans(key)}save();render();alert(`Workout saved${pbs.length?`. ${pbs.length} PB${pbs.length===1?'':'s'} recorded.`:'.'}`)}
function clearUnsaved(){if(history.some(h=>h.sessionKey===skey(current))){alert('This session is already saved.');return}if(!confirm('Clear this unsaved session?'))return;const plan=plans[skey(current)];if(plan)plan.exercises.forEach(ex=>delete state[stateKey(current,ex.filename)]);delete plans[skey(current)];save();render()}
function exportData(){const payload={version:VERSION,state,history,plans,rotationState,weightLog,current};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='gym-tracker-v8.5-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);state=d.state||{};history=d.history||[];plans=d.plans||{};rotationState=d.rotationState||{nextIndex:0};weightLog=d.weightLog||[];current=d.current||current;save();render()}catch{alert('That backup could not be read.')}};r.readAsText(file)}
function wipe(){if(!confirm('Wipe all v8.5 workout and weight data?'))return;state={};history=[];plans={};rotationState={nextIndex:0};weightLog=[];save();render()}
function render(){renderRotation();renderTabs();renderSession();renderWorkout();renderStats();renderProgress();renderWeight();renderHistory();renderSettings();libraryPill.textContent=LIB.length?`${LIB.length} exercises ready`:'Library missing'}
async function loadLibrary(){try{const res=await fetch('./exercise-library.json',{cache:'no-store'});if(!res.ok)throw new Error(`exercise-library.json returned ${res.status}`);LIB=await res.json();byRole={};for(const ex of LIB)(byRole[ex.role]??=[]).push(ex);libraryError=''}catch(e){LIB=[];byRole={};libraryError='Run prepare-exercise-library.py first.'}render()}
const rotation=document.getElementById('rotation'),nextPill=document.getElementById('nextPill'),tabs=document.getElementById('tabs'),sessionPanel=document.getElementById('sessionPanel'),workout=document.getElementById('workout'),sessionStats=document.getElementById('sessionStats'),progressPanel=document.getElementById('progressPanel'),weightPanel=document.getElementById('weightPanel'),historyPanel=document.getElementById('historyPanel'),settingsPanel=document.getElementById('settingsPanel'),libraryPill=document.getElementById('libraryPill');
document.getElementById('finishBtn').onclick=finish;document.getElementById('clearBtn').onclick=clearUnsaved;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};document.getElementById('wipeBtn').onclick=wipe;if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));save();loadLibrary();
</script>
</body>
