<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2B2B2B">
  <meta name="description" content="Muscle-first workout builder with exercise demos, progression, notes and local-only tracking.">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Gym Tracker</title>
</head>
<body>
  <main id="app" class="app"></main>

  <div id="restBar" class="rest-bar" hidden>
    <div>
      <strong>Rest</strong>
      <span id="restText">2:00</span>
    </div>
    <button class="button ghost compact" type="button" data-action="end-rest">End</button>
  </div>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <div class="bottom-nav-inner">
      <button class="nav-button active" type="button" data-tab="build"><span>Build</span></button>
      <button class="nav-button" type="button" data-tab="workout"><span>Workout</span></button>
      <button class="nav-button" type="button" data-tab="progress"><span>Progress</span></button>
    </div>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <noscript><div class="error">Gym Tracker needs JavaScript enabled.</div></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
