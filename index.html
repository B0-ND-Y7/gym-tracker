<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><title>Gym Tracker</title>
<style>
:root{--bg:#0b0d0f;--card:#14181c;--card2:#1b2025;--line:#292f35;--text:#f2f4f5;--muted:#9aa3ab;--accent:#72e38b;--accent2:#3fc766;--danger:#ff6b6b;--r:16px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}.brand{font-weight:750;font-size:22px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12px;margin-top:2px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 11px;font-weight:650}.btn:active{transform:scale(.98)}.hero{background:linear-gradient(145deg,#171c20,#111417);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}.eyebrow{font-size:12px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:30px;margin:4px 0 2px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:13px}.section{margin:16px 0}.section h2{font-size:16px;margin:0 0 9px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:12px}.chip.active{color:#071109;background:var(--accent);border-color:var(--accent);font-weight:800}.mapbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;min-height:300px}.map{height:330px;display:flex;justify-content:center;align-items:center}.map>div{width:100%;height:100%}.map svg{max-height:315px!important}.maphint{text-align:center;color:var(--muted);font-size:12px;margin:-4px 0 8px}.viewrow{display:flex;justify-content:center;gap:7px;margin-bottom:4px}.exercise-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.ex.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.thumb{aspect-ratio:1;background:#0e1113;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.exbody{padding:8px}.exname{font-size:12px;font-weight:750;line-height:1.18;min-height:29px}.meta{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick{margin-top:7px;width:100%;padding:7px;border-radius:9px;border:0;background:var(--card2);color:var(--text);font-size:11px;font-weight:750}.ex.sel .pick{background:var(--accent);color:#071109}.workout-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muscle{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:800}.ex-title{font-size:16px;font-weight:800;margin-top:3px}.small{font-size:11px;color:var(--muted)}.gif{margin-top:9px;border-radius:13px;overflow:hidden;background:#0d1012;position:relative}.gif img{width:100%;display:block;max-height:300px;object-fit:contain}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}.field{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px}.field label{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.field input{width:100%;background:none;border:0;outline:0;color:var(--text);font-size:15px;font-weight:750}.note{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px;resize:none;min-height:42px;font:inherit;font-size:12px}.rest{margin-top:9px;display:flex;justify-content:space-between;align-items:center;background:#101914;border:1px solid #26452e;border-radius:12px;padding:9px}.rest strong{font-size:14px}.timer{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:850}.tabs{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(11,13,15,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.tabsin{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tab{background:none;border:0;color:var(--muted);padding:8px;font-weight:700;font-size:11px}.tab.active{color:var(--accent)}.buildbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px;margin:10px 0}.buildbar strong{display:block;font-size:13px}.buildbar span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.btn.ready{background:var(--accent);color:#071109;border-color:var(--accent)}.chosen{display:grid;gap:6px;margin:8px 0 10px}.chosenitem{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 8px;font-size:11px}.chosenitem .btn{padding:5px 7px;font-size:10px}.empty{padding:20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:30}.modal.open{display:flex}.sheet{background:#111417;border-radius:22px 22px 0 0;width:100%;max-height:85vh;overflow:auto;padding:15px 14px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.sheet h2{margin:0 0 8px}.close{float:right}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#e9f5eb;color:#09110b;padding:9px 12px;border-radius:999px;font-size:12px;font-weight:800;display:none;z-index:40}.toast.show{display:block}@media(min-width:620px){.app{padding-left:20px;padding-right:20px}.exercise-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.map{height:380px}.map svg{max-height:365px!important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="tabs"><div class="tabsin"><button class="tab active" data-tab="workout">Workout</button><button class="tab" data-tab="select">Muscles</button><button class="tab" data-tab="progress">Progress</button></div></div>
<div id="modal" class="modal"><div class="sheet"><button class="btn close" id="closeModal">Close</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='gymtracker-v14';
const defaults={day:0,workout:null,history:[],prefs:{avoid:[],fav:[]},notes:{},weight:null,build:null};
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')||defaults}catch{state=defaults}
state.prefs=state.prefs||{avoid:[],fav:[]}; state.notes=state.notes||{};
const DAYS=[
 {name:'Push',muscles:['chest','shoulders','triceps'],view:'FRONT'},
 {name:'Legs 1',muscles:['quads','glutes','calves'],view:'FRONT'},
 {name:'Pull',muscles:['back','rear delts','biceps'],view:'BACK'},
 {name:'Legs 2',muscles:['hamstrings','glutes','calves','quads'],view:'BACK'}
];
const MUSCLE_ALIASES={
 chest:['chest','pectorals','pec'], shoulders:['shoulder','deltoid','delts'], triceps:['triceps'],
 biceps:['biceps','brachialis','brachioradialis'], back:['back','lat','trapezius','rhomboid','erector'],
 'rear delts':['rear delt','posterior deltoid','reverse fly'], quads:['quad','quadriceps','thigh'],
 hamstrings:['hamstring','leg curl'], glutes:['glute','buttock','hip thrust'], calves:['calf','gastrocnemius','soleus']
};
let library=[],currentMuscle='',mapChart=null,mapView='FRONT',activeTab='workout',timer=null,remaining=0;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slug(s){return String(s||'').toLowerCase()}
function normalize(x,k){return {id:x.id||k,name:x.name||x.title||k,category:x.category||'',equipment:x.equipment||'',target:x.target||'',muscle_group:x.muscle_group||x.muscleGroup||'',image:x.image||`images/${k.replace(/\.gif$/i,'.jpg')}`,gif_url:x.gif_url||`videos/${k}`}}
async function loadLibrary(){try{const r=await fetch('exercise-library.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();library=Object.entries(d).map(([k,v])=>normalize(v,k));}catch{library=[]}if(!currentMuscle)currentMuscle=DAYS[state.day%4].muscles[0];render()}
function textOf(e){return slug([e.name,e.target,e.muscle_group,e.category,e.equipment].join(' '))}
function isBad(e){const t=textOf(e);return /lying|supine|on floor|floor|decline seated wide-grip/.test(t)&&/cable/.test(t)}
function matches(e,m){const t=textOf(e), aliases=MUSCLE_ALIASES[m]||[m];return aliases.some(a=>t.includes(slug(a)))}
function candidates(m){let a=library.filter(e=>!state.prefs.avoid.includes(e.id)&&!isBad(e)&&matches(e,m));a.sort((x,y)=>(state.prefs.fav.includes(y.id)-state.prefs.fav.includes(x.id))||x.name.localeCompare(y.name));return a}
function setsFor(m){return ['chest','back','quads','hamstrings','glutes'].includes(m)?3:2}
function exerciseCount(m){return ['calves','rear delts'].includes(m)?1:2}
function exById(id){return library.find(e=>e.id===id)}
function asset(p){return p||''}
function beginBuild(){state.build={day:state.day%4,selections:{}};activeTab='select';currentMuscle=DAYS[state.day%4].muscles[0];save();render()}
function ensureBuild(){if(!state.build||state.build.day!==state.day%4){state.build={day:state.day%4,selections:{}};save()}}
function selectedFor(m){ensureBuild();return state.build.selections[m]||[]}
function addSelection(m,id){ensureBuild();const arr=state.build.selections[m]||[];if(arr.includes(id))return;if(arr.length>=exerciseCount(m)){toast(`Already have ${arr.length} for ${m}`);return}arr.push(id);state.build.selections[m]=arr;save();render()}
function removeSelection(m,id){ensureBuild();state.build.selections[m]=(state.build.selections[m]||[]).filter(x=>x!==id);save();render()}
function completeBuild(){ensureBuild();const d=DAYS[state.day%4];const missing=d.muscles.filter(m=>(state.build.selections[m]||[]).length<exerciseCount(m));if(missing.length){currentMuscle=missing[0];toast(`Choose ${exerciseCount(missing[0])} ${missing[0]} exercise${exerciseCount(missing[0])>1?'s':''}`);render();return}
 const out=[];d.muscles.forEach(m=>(state.build.selections[m]||[]).forEach(eid=>out.push({id:crypto.randomUUID(),muscle:m,exerciseId:eid,sets:setsFor(m),reps:'8-12',weight:'',completed:false,note:state.notes[eid]||''})));state.workout={date:new Date().toISOString(),day:state.day%4,items:out,started:Date.now(),duration:0};state.build=null;activeTab='workout';save();toast('Workout ready');render()}
function newWorkout(){beginBuild()}
function render(){const app=document.getElementById('app');if(activeTab==='workout')renderWorkout(app);else if(activeTab==='select')renderSelect(app);else renderProgress(app);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))}
function renderWorkout(app){if(!state.workout||!state.workout.items?.length){const d=DAYS[state.day%4];app.innerHTML=`<div class="top"><div><div class="brand">Gym Tracker</div><div class="sub">${d.name} · choose your exercises first</div></div></div><div class="hero"><div class="eyebrow">Next workout</div><h1>${d.name}</h1><p>${d.muscles.join(' · ')}</p><button class="btn" style="margin-top:12px;background:var(--accent);color:#071109;border:0" onclick="beginBuild()">Choose exercises</button></div><div class="section"><div class="empty">Pick your exercises, then start the workout. Your choices stay saved until you change them.</div></div>`;return}
 const d=DAYS[state.workout.day],done=state.workout.items.filter(x=>x.completed).length;app.innerHTML=`<div class="top"><div><div class="brand">${d.name}</div><div class="sub">${done}/${state.workout.items.length} exercises complete</div></div><button class="btn" onclick="newWorkout()">Change</button></div><div class="hero"><div class="eyebrow">Today</div><h1>${d.name}</h1><p>${d.muscles.join(' · ')} · about 45–60 min</p></div>${state.workout.items.map((it,i)=>card(it,i)).join('')}`}
function card(it,i){const e=exById(it.exerciseId)||{name:'Exercise unavailable',equipment:'',gif_url:'',image:''};return `<div class="workout-card"><div class="row"><div><div class="muscle">${esc(it.muscle)}</div><div class="ex-title">${esc(e.name)}</div><div class="small">${esc(e.equipment)}</div></div><button class="btn" onclick="openChooser(${i})">Change</button></div><div class="gif"><img src="${esc(asset(e.gif_url))}" onerror="this.onerror=null;this.src='${esc(e.image)}'" alt="${esc(e.name)}"></div><div class="controls"><div class="field"><label>SETS</label><input type="number" min="1" max="8" value="${it.sets}" onchange="updateItem(${i},'sets',this.value)"></div><div class="field"><label>REPS</label><input value="${esc(it.reps)}" onchange="updateItem(${i},'reps',this.value)"></div><div class="field"><label>WEIGHT</label><input inputmode="decimal" value="${esc(it.weight)}" placeholder="kg" onchange="updateItem(${i},'weight',this.value)"></div></div><textarea class="note" placeholder="Notes for this exercise…" onchange="updateItem(${i},'note',this.value)">${esc(it.note)}</textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="toggleDone(${i})">${it.completed?'✓ Completed':'Mark complete'}</button><button class="btn" onclick="startRest()">Rest 90s</button></div><div class="rest"><strong>Rest timer</strong><span class="timer">${remaining>0?format(remaining):'Ready'}</span></div></div>`}
function renderSelect(app){ensureBuild();const d=DAYS[state.build.day],m=d.muscles.includes(currentMuscle)?currentMuscle:d.muscles[0];currentMuscle=m;const chosen=selectedFor(m);const complete=d.muscles.every(x=>(state.build.selections[x]||[]).length>=exerciseCount(x));
 app.innerHTML=`<div class="top"><div><div class="brand">Build ${d.name}</div><div class="sub">Pick the exercises you actually want to do</div></div><button class="btn" onclick="cancelBuild()">Back</button></div><div class="buildbar"><div><strong>${complete?'Workout ready':'Choose your exercises'}</strong><span>${d.muscles.map(x=>`${x} ${(state.build.selections[x]||[]).length}/${exerciseCount(x)}`).join(' · ')}</span></div><button class="btn ${complete?'ready':''}" onclick="completeBuild()">${complete?'Start workout':'Finish'}</button></div><div class="chips">${d.muscles.map(x=>`<button class="chip ${x===m?'active':''}" onclick="chooseMuscle('${x}')">${x} <small>${(state.build.selections[x]||[]).length}/${exerciseCount(x)}</small></button>`).join('')}</div><div class="mapbox"><div class="viewrow"><button class="btn ${mapView==='FRONT'?'active':''}" onclick="setMap('FRONT')">Front</button><button class="btn ${mapView==='BACK'?'active':''}" onclick="setMap('BACK')">Back</button></div><div id="bodymap" class="map"></div><div class="maphint">Tap a highlighted muscle to choose exercises for it</div></div><div class="section"><div class="row"><h2 style="margin:0">${esc(m)}</h2><span class="small">${candidates(m).length} available · choose ${exerciseCount(m)}</span></div><div class="chosen">${chosen.map((id,i)=>{const e=exById(id);return `<div class="chosenitem"><span>${i+1}. ${esc(e?.name||'Exercise')}</span><button class="btn" onclick="removeSelection('${m}','${esc(id)}')">Remove</button></div>`}).join('')||'<div class="small" style="margin:8px 0">Nothing selected yet.</div>'}</div><div class="exercise-grid">${candidates(m).map(e=>exerciseTile(e,m,chosen.includes(e.id))).join('')||'<div class="empty" style="grid-column:1/-1">No matching exercises yet.</div>'}</div></div>`;initMap()}
function chooseMuscle(m){if(DAYS[state.day%4].muscles.includes(m)||state.build?.day===state.day%4){currentMuscle=m;mapView=['back','rear delts','hamstrings'].includes(m)?'BACK':'FRONT';render()}}
function exerciseTile(e,m,selected){const fav=state.prefs.fav.includes(e.id);return `<div class="ex ${selected?'sel':''}"><div class="thumb"><img src="${esc(e.image)}" loading="lazy" onerror="this.onerror=null;this.src='${esc(e.gif_url)}'" alt=""></div><div class="exbody"><div class="exname">${esc(e.name)}</div><div class="meta">${esc(e.equipment||e.category)}</div><button class="pick" ${selected?'disabled':''} onclick="addSelection('${esc(m)}','${esc(e.id)}')">${selected?'Selected':'Choose'}</button><button class="pick" onclick="toggleFav('${esc(e.id)}')">${fav?'★':'☆'} Favourite</button></div></div>`}
function initMap(){const el=document.getElementById('bodymap');if(!el||!window.BodyMuscles)return;try{if(mapChart)mapChart.destroy();const {BodyChart,ViewSide}=BodyMuscles;mapChart=new BodyChart(el,{view:mapView==='FRONT'?ViewSide.FRONT:ViewSide.BACK,bodyState:mapState(),onMuscleClick:(id,name)=>{const m=mapToApp(id,name);if(m)chooseMuscle(m)}})}catch(e){el.innerHTML='<div class="empty">Muscle map unavailable. Use the muscle buttons above.</div>'}}
function mapState(){const ids={chest:['chest-upper-left','chest-upper-right','chest-lower-left','chest-lower-right'],shoulders:['shoulder-front-left','shoulder-front-right','shoulder-side-left','shoulder-side-right'],biceps:['biceps-left','biceps-right'],triceps:['triceps-left','triceps-right'],back:['lat-left','lat-right','trapezius-left','trapezius-right','rhomboid-left','rhomboid-right'],['rear delts']:['shoulder-rear-left','shoulder-rear-right'],quads:['quadriceps-left','quadriceps-right'],hamstrings:['hamstring-left','hamstring-right'],glutes:['glute-left','glute-right'],calves:['calf-left','calf-right']};const s={};const d=DAYS[state.build?.day??state.day%4];d.muscles.forEach(m=>(ids[m]||[]).forEach(id=>s[id]={intensity:m===currentMuscle?9:3,selected:m===currentMuscle}));return s}
function mapToApp(id,name){const t=slug([id,name].join(' '));const exact=[...DAYS[state.build?.day??state.day%4].muscles];for(const m of exact){if((MUSCLE_ALIASES[m]||[]).some(a=>new RegExp(`\\b${a.replace(/[.*+?^${}()|[\\]\\\\]/g,'')}\\b`,'i').test(t))||new RegExp(`\\b${m.replace(/[.*+?^${}()|[\\]\\\\]/g,'')}\\b`,'i').test(t))return m}return null}
function setMap(v){mapView=v;render()}
function cancelBuild(){state.build=null;save();activeTab='workout';render()}
function openChooser(i){const it=state.workout.items[i];state.build={day:state.workout.day,selections:{}};DAYS[it.muscle?state.workout.day:state.day].muscles.forEach(m=>{state.build.selections[m]=state.workout.items.filter(x=>x.muscle===m).map(x=>x.exerciseId)});currentMuscle=it.muscle;save();activeTab='select';render()}
function updateItem(i,k,v){state.workout.items[i][k]=v;if(k==='note')state.notes[state.workout.items[i].exerciseId]=v;save()}
function toggleFav(id){const a=state.prefs.fav;state.prefs.fav=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();render()}
function toggleDone(i){state.workout.items[i].completed=!state.workout.items[i].completed;if(state.workout.items[i].completed)state.workout.items[i].completedAt=Date.now();save();render();if(state.workout.items.every(x=>x.completed))finishWorkout()}
function finishWorkout(){state.history.push(JSON.parse(JSON.stringify(state.workout)));state.day=(state.day+1)%4;state.workout=null;save();toast('Workout complete · next day queued');setTimeout(render,500)}
function startRest(){clearInterval(timer);remaining=90;tick();timer=setInterval(tick,1000)}
function tick(){document.querySelectorAll('.timer').forEach(n=>n.textContent=remaining>0?format(remaining):'Ready');if(remaining<=0){clearInterval(timer);navigator.vibrate?.(120);if(document.querySelector('.rest'))toast('Rest complete');return}remaining--}
function format(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function renderProgress(app){const h=state.history||[],completed=h.reduce((n,w)=>n+w.items.length,0);app.innerHTML=`<div class="top"><div><div class="brand">Progress</div><div class="sub">Stored on this device</div></div></div><div class="hero"><div class="eyebrow">Training</div><h1>${h.length} sessions</h1><p>${completed} exercises recorded · ${state.weight?`Body weight ${esc(state.weight)} kg`:'Add body weight below'}</p></div><div class="section"><h2>Body weight</h2><div class="controls"><div class="field"><label>KG</label><input inputmode="decimal" value="${esc(state.weight||'')}" placeholder="100" onchange="state.weight=this.value;save()"></div></div></div><div class="section"><h2>Recent sessions</h2>${h.slice(-8).reverse().map(w=>`<div class="workout-card"><div class="row"><strong>${esc(DAYS[w.day]?.name||'Workout')}</strong><span class="small">${new Date(w.date).toLocaleDateString()}</span></div><div class="small" style="margin-top:5px">${w.items.length} exercises · ${w.items.reduce((n,x)=>n+Number(x.sets||0),0)} sets</div></div>`).join('')||'<div class="empty">Complete a workout and your history will appear here.</div>'}</div>`}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;if(activeTab==='select'&&!state.build)beginBuild();else render()});
loadLibrary();
</script>

</body></html>
