<body>
<div class="shell">
<header class="topbar"><div class="brand">Gym Tracker</div><div class="status" id="status">Loading</div></header>

</div>

<script>
const VERSION='14.0';
const DAYS=['Monday','Wednesday','Friday','Weekend'];
const ROTATION=['push','legs1','pull','legs2'];
const WORKOUTS={
 push:{name:'Push',focus:'Chest · shoulders · triceps',muscles:['chest','shoulders','triceps']},
 legs1:{name:'Legs 1',focus:'Quads · calves · core',muscles:['quads','calves','core']},
 pull:{name:'Pull',focus:'Back · rear delts · biceps',muscles:['back','biceps','rear_shoulders']},
 legs2:{name:'Legs 2',focus:'Hamstrings · glutes · hips',muscles:['hamstrings','glutes','hips']}
};
const MUSCLE_LABEL={chest:'Chest',shoulders:'Shoulders',triceps:'Triceps',quads:'Quads',calves:'Calves',core:'Core',back:'Back',biceps:'Biceps',rear_shoulders:'Rear delts',hamstrings:'Hamstrings',glutes:'Glutes',hips:'Hips'};
const ROLE_TO_MUSCLE={push_horizontal:'chest',push_incline:'chest',push_fly:'chest',push_vertical:'shoulders',push_lateral:'shoulders',push_triceps:'triceps',pull_vertical:'back',pull_row:'back',pull_rear:'rear_shoulders',pull_biceps:'biceps',lower_compound:'quads',lower_quad:'quads',lower_ham_curl:'hamstrings',lower_hinge:'hamstrings',lower_glute:'glutes',lower_hip:'hips',lower_calf:'calves'};
const DEFAULTS={
 chest:['bench press','chest press','incline bench press'],shoulders:['shoulder press','lateral raise','machine shoulder press'],triceps:['triceps pushdown','triceps extension'],
 quads:['leg press','hack squat','leg extension'],calves:['calf raise'],core:['crunch','abdominal'],back:['lat pulldown','seated row','pulldown'],biceps:['bicep curl','biceps curl','preacher curl'],rear_shoulders:['reverse fly','rear delt'],

};
const MUSCLE_SYNONYMS={chest:['chest','pector'],shoulders:['shoulder','deltoid'],triceps:['tricep'],quads:['quad','quadricep'],calves:['calf'],core:['abdom','crunch','core'],back:['back','lat','trap','rhomboid'],biceps:['bicep'],rear_shoulders:['rear delt','posterior delt'],hamstrings:['hamstring'],glutes:['glute'],hips:['hip','adductor','abductor']};
let LIB=[],libraryError='',current=localStorage.getItem('gym-v9-current')||bestDay(),history=read('gym-v9-history',[]),weightLog=read('gym-v9-weight',[]),prefs=read('gym-v11-prefs',{}),notes=read('gym-v13-notes',{}),plans=read('gym-v9-plans',{}),state=read('gym-v9-state',{}),rotation=read('gym-v9-rotation',{nextIndex:0}),sessionStarts=read('gym-v11-session-starts',{}),rest=read('gym-v9-rest',{end:0,label:'',duration:0,ready:false}),view=localStorage.getItem('gym-v11-view')||'home',selectedMuscle=null;
function read(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}function save(){localStorage.setItem('gym-v9-current',current);localStorage.setItem('gym-v9-history',JSON.stringify(history));localStorage.setItem('gym-v9-weight',JSON.stringify(weightLog));localStorage.setItem('gym-v11-prefs',JSON.stringify(prefs));localStorage.setItem('gym-v13-notes',JSON.stringify(notes));localStorage.setItem('gym-v9-plans',JSON.stringify(plans));localStorage.setItem('gym-v9-state',JSON.stringify(state));localStorage.setItem('gym-v9-rotation',JSON.stringify(rotation));localStorage.setItem('gym-v11-session-starts',JSON.stringify(sessionStarts));localStorage.setItem('gym-v9-rest',JSON.stringify(rest));localStorage.setItem('gym-v11-view',view)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function bestDay(){const d=new Date().getDay();if(d<=2&&d>0)return'Monday';if(d<=4&&d>2)return'Wednesday';if(d===5)return'Friday';return'Weekend'}function mondayKey(){const d=new Date();d.setHours(12,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}function skey(day=current){return `v14::${mondayKey()}::${day}`}function clean(v){const n=Number(v);return Number.isFinite(n)?String(Math.round(n*10)/10):'—'}function fmt(sec){sec=Math.max(0,Math.round(Number(sec)||0));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function role(ex){return ex.role||''}function muscleOf(ex){const r=role(ex);if(ROLE_TO_MUSCLE[r])return ROLE_TO_MUSCLE[r];const text=`${ex.muscle_group||''} ${ex.target||''} ${ex.category||''} ${ex.name||''}`.toLowerCase();for(const [m,words] of Object.entries(MUSCLE_SYNONYMS))if(words.some(w=>text.includes(w)))return m;return null}function pref(file){return prefs[file]||{}}function blocked(ex){const p=pref(ex.filename);return p.avoid||p.unavailable}function media(ex){return ex.gif_url||ex.image||''}function equipment(ex){return ex.equipment||'Gym equipment'}
function filtered(muscle){let arr=LIB.filter(x=>!blocked(x)&&muscleOf(x)===muscle);if(arr.length)return arr;const words=MUSCLE_SYNONYMS[muscle]||[];return LIB.filter(x=>!blocked(x)&&words.some(w=>`${x.name} ${x.target} ${x.muscle_group}`.toLowerCase().includes(w)))}
function sortSimple(arr,muscle){const defaults=DEFAULTS[muscle]||[];return [...arr].sort((a,b)=>{const score=x=>{const t=`${x.name} ${x.equipment}`.toLowerCase();let s=0;if(defaults.some(d=>t.includes(d)))s+=100;if(/machine|cable|smith|dumbbell|barbell|leverage|sled/.test(t))s+=10;if(/twist|behind head|guillotine|jefferson|kayak|complex|unusual/.test(t))s-=35;if(pref(x.filename).favorite)s+=25;return s};return score(b)-score(a)||a.name.localeCompare(b.name)})}
function findByName(muscle,q){const low=q.toLowerCase();return sortSimple(filtered(muscle),muscle).find(x=>x.name.toLowerCase().includes(low))}
function currentPlan(){const key=skey(current);let p=plans[key];if(p&&p.version===14)return p;const split=ROTATION[(rotation.nextIndex||0)%4];p={version:14,split,muscles:WORKOUTS[split].muscles,choices:{},created:new Date().toISOString()};WORKOUTS[split].muscles.forEach(m=>{const pool=sortSimple(filtered(m),m);p.choices[m]=pool.slice(0,3).map(x=>x.filename)});plans[key]=p;save();return p}
function exByFile(file){return LIB.find(x=>x.filename===file)}function selectedExercises(plan,m){return (plan.choices[m]||[]).map(exByFile).filter(Boolean)}
function ensureState(ex){const key=`${skey(current)}::${ex.filename}`;if(!state[key]){state[key]={sets:Array.from({length:3},()=>({w:'',r:'',d:false})),note:notes[ex.filename]||''};const old=latestExercise(ex.filename);if(old){const w=workingWeight(old.sets);if(w)state[key].sets.forEach(s=>s.w=clean(w))}}return state[key]}
function workingWeight(sets){const a=(sets||[]).filter(x=>x.d).map(x=>Number(x.w)).filter(x=>x>0);return a.length?a.sort((a,b)=>a-b)[Math.floor(a.length/2)]:null}function latestExercise(file){for(const h of history){const x=(h.exercises||[]).find(e=>e.filename===file);if(x)return x}return null}
function setView(v){view=['home','workout','progress','more'].includes(v)?v:'home';document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===`${view}Screen`));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));localStorage.setItem('gym-v11-view',view);if(view==='workout')renderWorkout();if(view==='home')renderHome();if(view==='progress')renderProgress();if(view==='more')renderMore();window.scrollTo({top:0,behavior:'auto'});save()}
function renderHome(){if(!LIB.length){home.innerHTML=`<div class="hero"><div class="eyebrow">Setup</div><h1>Exercise library missing</h1><p>${esc(libraryError)}</p></div>`;return}const plan=currentPlan(),w=WORKOUTS[plan.split],next=w.name,done=history.length;home.innerHTML=`<div class="hero"><div class="eyebrow">Next workout</div><h1>${esc(next)}</h1><p>${esc(w.focus)}</p><div class="rotation">${ROTATION.map((k,i)=>`<span class="pill ${i===(rotation.nextIndex||0)?'current':''}">${esc(WORKOUTS[k].name)}</span>`).join('')}</div><div style="margin-top:11px"><button class="btn btn-primary" id="start">Open workout</button></div></div><div class="grid2"><button class="quick" data-go="progress"><div class="eyebrow">Training</div><b>${done} sessions</b><span>View history and improvements.</span></button><button class="quick" data-go="more"><div class="eyebrow">Exercise pool</div><b>${LIB.length} exercises</b><span>Choose, avoid and favourite.</span></button></div>`;document.getElementById('start').onclick=()=>setView('workout');home.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go))}
function bodySvg(activeMuscles,selected){const active=new Set(activeMuscles);const p=(m,cls,pts,label)=>`<g class="body-hit" data-muscle="${m}" tabindex="0"><path class="body-part ${active.has(m)?'active':'dim'} ${selected===m?'selected':''}" d="${pts}"/><text class="body-label" x="50" y="${label}">${MUSCLE_LABEL[m]}</text></g>`;return `<svg class="body-svg" viewBox="0 0 100 205" aria-label="Interactive muscle map"><circle cx="50" cy="16" r="9" class="body-part ${active.includes('core')?'active':''}"/><path class="body-part" d="M39 28 Q50 24 61 28 L67 62 61 92 55 93 50 69 45 93 39 92 33 62Z"/><path class="body-part" d="M34 31 L21 37 13 69 19 72 30 52 39 45Z"/><path class="body-part" d="M66 31 L79 37 87 69 81 72 70 52 61 45Z"/><path class="body-part" d="M40 89 L48 90 47 145 39 145Z"/><path class="body-part" d="M52 90 L60 89 61 145 53 145Z"/><path class="body-part" d="M39 144 L47 144 44 195 35 195Z"/><path class="body-part" d="M53 144 L61 144 65 195 56 195Z"/>${p('chest','',`M34 42 Q42 35 50 45 Q42 57 34 52Z`,48)}${p('shoulders','',`M30 35 Q34 29 40 34 L39 47 Q33 50 29 44Z`,39)}${p('triceps','',`M20 39 L30 36 29 53 21 66 17 64Z`,58)}${p('back','',`M41 45 Q50 38 59 45 L57 69 50 75 43 69Z`,62)}${p('rear_shoulders','',`M60 35 Q66 29 70 35 L71 45 Q67 50 61 47Z`,39)}${p('biceps','',`M70 39 L80 42 79 55 72 65 69 59Z`,54)}${p('core','',`M43 53 L57 53 55 82 50 87 45 82Z`,70)}${p('quads','',`M40 91 L49 91 47 119 40 137 37 133Z`,111)}${p('hamstrings','',`M51 91 L60 91 63 133 59 137 52 119Z`,112)}${p('glutes','',`M40 84 Q50 79 60 84 L59 99 Q50 105 41 99Z`,92)}${p('hips','',`M37 91 L43 91 42 111 36 108Z`,103)}${p('calves','',`M39 143 L47 143 44 194 36 194Z`,170)}`}
function renderWorkout(){if(!LIB.length){workout.innerHTML='';workoutActions.innerHTML='';return}const plan=currentPlan(),w=WORKOUTS[plan.split];if(!selectedMuscle||!w.muscles.includes(selectedMuscle))selectedMuscle=w.muscles[0];const pool=sortSimple(filtered(selectedMuscle),selectedMuscle),chosen=selectedExercises(plan,selectedMuscle),active=w.muscles;workout.innerHTML=`<div class="workout-head"><div><div class="eyebrow">${esc(plan.split==='legs1'||plan.split==='legs2'?'Lower body':'Upper body')}</div><h1>${esc(w.name)}</h1><p class="sub">Choose one exercise for each muscle. You can change it any time.</p></div><span class="pill">${w.muscles.length} muscles</span></div><div class="muscle-layout"><div class="body-card"><div class="body-title">Tap a muscle</div>${bodySvg(active,selectedMuscle)}</div><div class="muscle-panel"><div class="muscle-tabs">${active.map(m=>`<button class="muscle-tab ${m===selectedMuscle?'active':''}" data-muscle-tab="${m}">${MUSCLE_LABEL[m]}</button>`).join('')}</div><div class="choice-head"><div><h2>${MUSCLE_LABEL[selectedMuscle]}</h2><span>${pool.length} available · tap to select</span></div><button class="btn btn-small" id="refreshChoices">Refresh</button></div><div class="exercise-grid">${pool.map(ex=>`<button class="choice ${chosen.some(x=>x.filename===ex.filename)?'selected':''}" data-choice="${esc(ex.filename)}"><img loading="lazy" src="${esc(media(ex))}" alt="${esc(ex.name)}"><div class="choice-name">${esc(ex.name)}</div><div class="choice-meta">${esc(equipment(ex))}</div></button>`).join('')||'<div class="card">No suitable exercises found for this muscle.</div>'}</div><div class="selected-list"><div class="choice-head"><h2>Your ${MUSCLE_LABEL[selectedMuscle]} exercise</h2><span>Saved to this workout</span></div>${chosen.map(ex=>renderSelected(ex,plan)).join('')}</div></div></div>`;workout.querySelectorAll('[data-muscle-tab]').forEach(b=>b.onclick=()=>{selectedMuscle=b.dataset.muscleTab;renderWorkout()});workout.querySelectorAll('[data-muscle]').forEach(g=>{g.onclick=()=>{if(active.includes(g.dataset.muscle)){selectedMuscle=g.dataset.muscle;renderWorkout()}};g.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&active.includes(g.dataset.muscle)){e.preventDefault();selectedMuscle=g.dataset.muscle;renderWorkout()}}});workout.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>chooseExercise(selectedMuscle,b.dataset.choice));document.getElementById('refreshChoices').onclick=()=>refreshMuscle(selectedMuscle);renderWorkoutActions();bindWorkoutInputs()}
function renderWorkoutActions(){const plan=currentPlan(),saved=history.some(h=>h.sessionKey===skey(current)),selected=plan.muscles.reduce((n,m)=>n+(plan.choices[m]?.length?1:0),0);workoutActions.innerHTML=`<div class="card"><div class="choice-head"><div><h2>${selected}/${plan.muscles.length} muscles selected</h2><span>${saved?'Workout saved':'Complete your sets, then save the session.'}</span></div><button class="btn btn-primary" id="finishWorkout" ${saved?'disabled':''}>${saved?'Saved':'Finish & save'}</button></div></div>`;const b=document.getElementById('finishWorkout');if(b&&!saved)b.onclick=finishWorkout}
function finishWorkout(){const plan=currentPlan(),key=skey(current),selected=plan.muscles.reduce((n,m)=>n+(plan.choices[m]?.length?1:0),0);if(history.some(h=>h.sessionKey===key))return;if(selected<plan.muscles.length){alert('Choose an exercise for each muscle first.');return}let totalSets=0,completed=0;const exercises=[];for(const m of plan.muscles){const ex=selectedExercises(plan,m)[0];const e=ensureState(ex);const done=e.sets.filter(s=>s.d).length;totalSets+=e.sets.length;completed+=done;if(done)exercises.push({filename:ex.filename,id:ex.id,name:ex.name,role:ex.role,targetSets:e.sets.length,targetReps:ex.reps,sets:e.sets.filter(s=>s.d).map(s=>({w:s.w,r:s.r,d:true}))})}if(!completed){alert('Mark at least one completed set before saving.');return}const start=sessionStarts[key]||Date.now();const pbs=[];for(const ex of exercises){const now=workingWeight(ex.sets),old=latestExercise(ex.filename),oldw=old?workingWeight(old.sets):null;if(now&&(!oldw||now>oldw))pbs.push({name:ex.name,text:oldw?`+${clean(now-oldw)} kg`:'First recorded result'})}const rec={version:VERSION,sessionKey:key,week:mondayKey(),day:current,split:plan.split,workoutName:WORKOUTS[plan.split].name,isoDate:new Date().toISOString(),durationSeconds:Math.max(0,Math.round((Date.now()-start)/1000)),totalSets:completed,prescribedSets:totalSets,partial:completed<totalSets,exercises,pbs,improvements:pbs};history.unshift(rec);rotation.nextIndex=(ROTATION.indexOf(plan.split)+1)%4;delete sessionStarts[key];save();renderAll();setView('home');alert('Workout saved.')}
function renderSelected(ex,plan){const e=ensureState(ex),key=stateKey(ex),saved=history.some(h=>h.sessionKey===skey(current));return `<article class="selected-card"><div class="selected-top"><button class="selected-media" data-open="${esc(ex.filename)}"><img loading="lazy" src="${esc(media(ex))}" alt="${esc(ex.name)}"></button><div class="selected-info"><h3>${esc(ex.name)}</h3><div class="target-line">${esc(MUSCLE_LABEL[muscleOf(ex)]||ex.target||'Target')}</div><div class="meta"><span>${esc(equipment(ex))}</span><span>${esc(ex.reps||'8–12 reps')}</span><span>3 sets</span></div><div class="selected-actions"><button class="btn btn-small btn-primary" data-change="${esc(muscleOf(ex))}">Change</button><button class="btn btn-small" data-info="${esc(ex.filename)}">Info</button></div></div></div><div class="sets"><div class="set-head"><div></div><div>kg</div><div>reps</div><div>done</div></div>${e.sets.map((s,i)=>`<div class="set-row"><div class="set-num">${i+1}</div><input type="number" inputmode="decimal" step="0.5" value="${esc(s.w)}" data-set="${i}" data-field="w" ${saved?'disabled':''}><input type="number" inputmode="numeric" value="${esc(s.r)}" data-set="${i}" data-field="r" ${saved?'disabled':''}><input type="checkbox" ${s.d?'checked':''} data-set="${i}" data-field="d" ${saved?'disabled':''}></div>`).join('')}</div><textarea class="note" maxlength="1200" placeholder="Notes for this exercise: seat position, pin, setup..." data-note="${esc(ex.filename)}" ${saved?'disabled':''}>${esc(notes[ex.filename]||'')}</textarea></article>`}
function stateKey(ex){return `${skey(current)}::${ex.filename}`}
function chooseExercise(muscle,file){const plan=currentPlan();plan.choices[muscle]=[file];selectedMuscle=muscle;save();renderWorkout()}
function refreshMuscle(muscle){const plan=currentPlan(),old=new Set(plan.choices[muscle]||[]),pool=sortSimple(filtered(muscle),muscle).filter(x=>!old.has(x.filename));if(!pool.length)return;plan.choices[muscle]=[pool[0].filename];save();renderWorkout()}
function bindWorkoutInputs(){workout.querySelectorAll('input[data-set]:not(:disabled)').forEach(i=>i.oninput=i.onchange=()=>{const ex=i.closest('.selected-card').querySelector('[data-open]')?.dataset.open;if(!ex)return;const x=exByFile(ex),e=ensureState(x),s=e.sets[+i.dataset.set];s[i.dataset.field]=i.dataset.field==='d'?i.checked:i.value;if(i.dataset.field==='d'&&i.checked)startRest(x);save();renderHome()});workout.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{notes[t.dataset.note]=t.value;save()});workout.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openInfo(b.dataset.open));workout.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>openInfo(b.dataset.info));workout.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{selectedMuscle=b.dataset.change;renderWorkout();setTimeout(()=>document.querySelector('.exercise-grid')?.scrollIntoView({behavior:'smooth',block:'start'}),30)})}
const observer=new MutationObserver(()=>{if(view==='workout')bindWorkoutInputs()});observer.observe(workout,{childList:true,subtree:true});
function openInfo(file){const ex=exByFile(file);if(!ex)return;const p=pref(file);modalBody.innerHTML=`<div class="modal-media"><img src="${esc(media(ex))}" alt="${esc(ex.name)}"></div><h2>${esc(ex.name)}</h2><div class="info-grid"><div class="info"><label>Equipment</label><p>${esc(ex.equipment||'Gym equipment')}</p></div><div class="info"><label>Target</label><p>${esc(ex.target||MUSCLE_LABEL[muscleOf(ex)]||'—')}</p></div><div class="info"><label>Secondary</label><p>${esc((ex.secondary_muscles||[]).join(', ')||'—')}</p></div><div class="info"><label>Work</label><p>${esc(ex.reps||'8–12 reps')} · 3 sets · 2:00 rest</p></div></div><div class="info" style="margin-top:6px"><label>My notes</label><textarea class="note" id="modalNote" maxlength="1200" placeholder="Your setup, seat position, pin number...">${esc(notes[file]||'')}</textarea></div><div class="actions" style="margin-top:6px"><button class="btn btn-small ${p.favorite?'btn-primary':''}" id="fav">${p.favorite?'Favourite ✓':'Favourite'}</button><button class="btn btn-small ${p.avoid?'btn-danger':''}" id="avoid">${p.avoid?'Avoided ✓':'Avoid'}</button><button class="btn btn-small ${p.unavailable?'btn-danger':''}" id="unavail">${p.unavailable?'Not at gym ✓':'Not at my gym'}</button></div>`;document.getElementById('modalNote').oninput=e=>{notes[file]=e.target.value;save()};document.getElementById('fav').onclick=()=>togglePref(file,'favorite');document.getElementById('avoid').onclick=()=>togglePref(file,'avoid');document.getElementById('unavail').onclick=()=>togglePref(file,'unavailable');modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
function togglePref(file,field){const p=pref(file);p[field]=!p[field];if(p[field]&&(field==='avoid'||field==='unavailable'))p.favorite=false;prefs[file]=p;save();modal.classList.remove('open');renderWorkout();renderMore()}
function startRest(ex){rest={end:Date.now()+120000,label:'Rest',duration:120,ready:false};save();tickRest()}
function tickRest(){if(!restDock)return;if(!rest.end){restDock.classList.remove('show');return}const left=Math.ceil((rest.end-Date.now())/1000);restDock.classList.add('show');if(left>0){restLabel.textContent='Rest';restTime.textContent=fmt(left);restDock.classList.remove('ready')}else{restLabel.textContent='Ready';restTime.textContent='Start';restDock.classList.add('ready');if(!rest.ready){rest.ready=true;save();if(navigator.vibrate)navigator.vibrate([100,80,100])}if(Date.now()-rest.end>10000){rest.end=0;save();restDock.classList.remove('show')}}}setInterval(tickRest,500);document.addEventListener('visibilitychange',tickRest);
function renderProgress(){const latest=[...weightLog].sort((a,b)=>a.date.localeCompare(b.date)).at(-1),sessions=history.length,total=history.reduce((n,h)=>n+(h.totalSets||0),0),pbs=history.reduce((n,h)=>n+(h.pbs?.length||0),0);progress.innerHTML=`<div class="stats"><div class="stat"><strong>${sessions}</strong><span>sessions</span></div><div class="stat"><strong>${total}</strong><span>sets</span></div><div class="stat"><strong>${pbs}</strong><span>PBs</span></div></div><div class="list-row" style="margin-top:8px"><b>Body weight</b><div class="sub">${latest?clean(latest.weight)+' kg':'No weight logged yet.'}</div><div class="actions" style="margin-top:6px"><input id="weightInput" type="number" inputmode="decimal" step="0.1" placeholder="kg"><button class="btn btn-small" id="weightSave">Add weight</button></div></div><div style="margin-top:8px"><div class="eyebrow">Recent workouts</div>${history.slice(0,8).map(h=>`<div class="list-row"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(h.workoutName||h.split||'Workout')}</b><span class="muted">${esc((h.isoDate||'').slice(0,10))}</span></div><div class="sub">${h.totalSets||0} sets · ${h.pbs?.length||0} PBs · ${fmt(h.durationSeconds||0)}</div></div>`).join('')||'<div class="sub" style="margin-top:5px">Complete a workout and it will appear here.</div>'}</div>`;document.getElementById('weightSave')?.addEventListener('click',()=>{const v=Number(document.getElementById('weightInput').value);if(!(v>0))return;weightLog.push({date:new Date().toISOString().slice(0,10),weight:v});save();renderProgress()})}
function renderMore(){const marked=Object.entries(prefs).filter(([,p])=>p.favorite||p.avoid||p.unavailable);more.innerHTML=`<div class="eyebrow">Exercise preferences</div><p class="sub">Avoid exercises you dislike or do not have. Favourites are prioritised.</p><div style="margin-top:8px">${marked.map(([f,p])=>`<div class="list-row"><b>${esc(exByFile(f)?.name||f)}</b><div class="sub">${p.favorite?'Favourite ':''}${p.avoid?'Avoided ':''}${p.unavailable?'Not at gym':''}</div></div>`).join('')||'<div class="sub">No preferences yet.</div>'}</div><div class="eyebrow" style="margin-top:12px">Backup</div><div class="actions" style="margin-top:7px"><button class="btn" id="export">Export data</button><label class="btn" style="text-align:center">Import data<input id="import" type="file" accept="application/json" hidden></label></div><div class="eyebrow" style="margin-top:14px">Reset</div><p class="sub">Resetting the current workout removes its unsaved choices and builds a fresh selection.</p><button class="btn btn-danger" id="reset" style="margin-top:7px">Reset current workout</button>`;document.getElementById('export').onclick=exportData;document.getElementById('import').onchange=e=>{if(e.target.files[0])importData(e.target.files[0])};document.getElementById('reset').onclick=resetWorkout}
function exportData(){const payload={version:VERSION,state,history,plans,rotationState:rotation,weightLog,current,prefs,sessionStarts,exerciseNotes:notes};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='gym-tracker-v14-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){const r=new FileReader();r.onload=()=>{try{let raw=String(r.result||'').replace(/^\uFEFF/,'').trim();if(raw.startsWith('```'))raw=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();const d=JSON.parse(raw);if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('Backup root is not an object');history=Array.isArray(d.history)?d.history:[];weightLog=Array.isArray(d.weightLog)?d.weightLog:[];state=d.state&&typeof d.state==='object'?d.state:{};plans=d.plans&&typeof d.plans==='object'?d.plans:{};rotation=d.rotationState&&typeof d.rotationState==='object'?d.rotationState:{nextIndex:0};current=DAYS.includes(d.current)?d.current:current;prefs=d.prefs&&typeof d.prefs==='object'?d.prefs:{};sessionStarts=d.sessionStarts&&typeof d.sessionStarts==='object'?d.sessionStarts:{};notes=d.exerciseNotes&&typeof d.exerciseNotes==='object'?d.exerciseNotes:{};rest={end:0,label:'',duration:0,ready:false};save();alert(`Backup imported successfully${d.version?' (v'+esc(d.version)+')':''}.`);renderAll()}catch(e){console.error(e);alert('That backup could not be imported.\n\n'+(e.message||'Unknown backup format'))}};r.readAsText(file,'UTF-8')}
function resetWorkout(){const key=skey(current);if(!confirm('Reset this workout and choose a fresh set of exercises?'))return;delete plans[key];for(const k of Object.keys(state))if(k.startsWith(key+'::'))delete state[k];delete sessionStarts[key];selectedMuscle=null;save();renderWorkout()}
function renderAll(){status.textContent=LIB.length?`v${VERSION} · ${LIB.length}`:'Library missing';renderHome();renderWorkout();renderProgress();renderMore();setView(view);tickRest()}
async function loadLibrary(){try{const r=await fetch('./exercise-library.json',{cache:'no-store'});if(!r.ok)throw new Error(`exercise-library.json returned ${r.status}`);const d=await r.json();if(!Array.isArray(d)||!d.length)throw new Error('exercise-library.json is empty');LIB=d.filter(x=>x&&x.filename&&x.name);if(!LIB.length)throw new Error('No valid exercises in library');libraryError=''}catch(e){LIB=[];libraryError=`${e.message}. Run prepare-exercise-library.py, then deploy again.`}renderAll()}
document.getElementById('modalClose').onclick=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true')};modal.onclick=e=>{if(e.target===modal)document.getElementById('modalClose').click()};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setView(b.dataset.view));save();loadLibrary();
</script>
